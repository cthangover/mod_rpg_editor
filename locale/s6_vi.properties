tools/rpg_editor/tab_character = Nhân vật trò chơi
tools/rpg_editor/character_no_sheet = Nhân vật này không có sprite đi bộ (Charset), nên không thể đặt lên bản đồ.
tools/rpg_editor/character_chosen = Actor {0} đã sẵn sàng. Nhấp vào bản đồ để đặt.
tools/rpg_editor/character_chosen_joins = Actor {0} đã sẵn sàng. Nói chuyện với nó trên bản đồ sẽ khiến nó gia nhập đội.
tools/rpg_editor/preview_title = Xem trước trạng thái
tools/rpg_editor/preview_hint = Các cờ bên dưới chỉ dành cho bản xem trước này: không lưu gì cả và cờ của trò chơi không đổi. Trạng thái hiển thị là trạng thái áp dụng cho các cờ đó.
tools/rpg_editor/preview_state = Trạng thái áp dụng: {0}
tools/rpg_editor/preview_base = Trạng thái gốc (không trạng thái nào áp dụng)
tools/rpg_editor/preview_no_flags = Đối tượng này không có cờ self. trong trạng thái hoặc tương tác của nó.
tools/rpg_editor/preview_no_object = Không tìm thấy đối tượng của vị trí đặt này.
tools/rpg_editor/preview_reset = Xoá cờ xem trước
tools/rpg_editor/preview_reset_tip = Đặt mọi cờ xem trước của vị trí đặt này về 0. Không ghi gì vào tệp hay trò chơi.
