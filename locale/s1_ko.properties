tools/rpg_editor/interact_y = 목표 Y
tools/rpg_editor/interact_dir = 방향
tools/rpg_editor/interact_dir_tip = 도착한 뒤 플레이어가 바라보는 방향
tools/rpg_editor/dir_down = 아래
tools/rpg_editor/dir_left = 왼쪽
tools/rpg_editor/dir_right = 오른쪽
tools/rpg_editor/dir_up = 위
tools/rpg_editor/interact_pick = 맵에서 칸 고르기
tools/rpg_editor/interact_pick_tip = 플레이어가 도착하는 칸을 클릭하세요. 다른 맵이면 그 맵이 먼저 열리고, 클릭하는 순간 이동 목표가 써지며, 왔던 맵이 다시 열립니다.
tools/rpg_editor/interact_scenario = 대화
tools/rpg_editor/interact_scenario_tip = 오브젝트가 여는 대화
tools/rpg_editor/interact_shop = 상점
