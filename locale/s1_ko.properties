tools/rpg_editor/encounters_add_enemy = 적 그룹 추가...
tools/rpg_editor/encounters_enemy_tip = 이 적만 담은 그룹 한 줄을 추가합니다. 줄을 고쳐 여러 적을 한 그룹으로 묶을 수 있습니다.
tools/rpg_editor/pick_no_target = 먼저 텔레포트의 맵을 고르세요
tools/rpg_editor/pick_same_map = 이 맵에서 도착 칸을 클릭하세요. Esc로 취소합니다.
tools/rpg_editor/pick_save_first = 먼저 맵을 저장하세요. 다른 맵의 칸을 고르면 그 맵이 열려 저장하지 않은 변경이 사라집니다
tools/rpg_editor/pick_on_map = 맵 {0}에서 도착 칸을 클릭하세요. Esc로 취소합니다.
tools/rpg_editor/pick_done = 텔레포트가 이제 맵 {0}의 칸 ({1}, {2})(으)로 이동합니다. Ctrl+S로 저장하세요.
tools/rpg_editor/pick_not_written = 텔레포트를 쓰지 못했습니다. 로그를 확인하세요
tools/rpg_editor/pick_cancelled = 선택을 취소했습니다
