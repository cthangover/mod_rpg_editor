tools/rpg_editor/interact_now_dialog = 대화 {0}을(를) 엽니다.
tools/rpg_editor/interact_now_shop = 상점 {0}을(를) 엽니다.
tools/rpg_editor/interact_now_custom = 사용자 정의 상호작용입니다. 파일에 적힌 그대로 남습니다. 종류를 고르면 바뀝니다.
tools/rpg_editor/interact_kind = 기능
