tools/rpg_editor/tool_effects = Hiệu ứng
tools/rpg_editor/tool_effects_tip = Vẽ mặt nạ hiệu ứng lên các ô (nút phải để xóa)
tools/rpg_editor/effect_profile_tip = Hồ sơ không khí mà công cụ Hiệu ứng vẽ
tools/rpg_editor/play = Chơi từ đây
tools/rpg_editor/play_tip = Khởi động trò chơi trên bản đồ này từ ô đã nhấp cuối cùng (trước khi nhấp thì từ điểm xuất hiện). Thay đổi chưa lưu sẽ được lưu trước
tools/rpg_editor/play_no_game = Trò chơi chưa chạy: chỉ chơi được từ trình chỉnh sửa khi đang ở trò chơi RPG
tools/rpg_editor/play_not_loaded = Trò chơi chưa biết bản đồ này
tools/rpg_editor/play_started = Trò chơi bắt đầu ở bản đồ {0}, ô ({1}, {2})
tools/rpg_editor/copy_none = Không có gì để sao chép: hãy chọn các đối tượng trước
tools/rpg_editor/copied = Đã sao chép {0} đối tượng
tools/rpg_editor/paste_none = Bộ nhớ tạm trống: hãy sao chép đối tượng trước (Ctrl+C)
tools/rpg_editor/paste_refused = Từ chối dán: các bản sao không vừa bản đồ, hoặc bản đồ thuộc mod khác
tools/rpg_editor/pasted = Đã dán {0} đối tượng. Ctrl+Z để hoàn tác
