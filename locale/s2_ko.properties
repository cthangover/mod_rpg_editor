tools/rpg_editor/tool_effects = 효과
tools/rpg_editor/tool_effects_tip = 칸 위에 효과 마스크를 칠합니다 (오른쪽 버튼은 지웁니다)
tools/rpg_editor/effect_profile_tip = 효과 도구가 칠하는 분위기 프로필
tools/rpg_editor/play = 여기서 플레이
tools/rpg_editor/play_tip = 마지막으로 누른 칸에서 이 맵으로 게임을 시작합니다 (누르기 전에는 시작 지점). 저장되지 않은 변경은 먼저 저장됩니다
tools/rpg_editor/play_no_game = 게임이 실행 중이 아닙니다. 편집기에서 플레이는 RPG 게임에서만 됩니다
tools/rpg_editor/play_not_loaded = 게임이 아직 이 맵을 모릅니다
tools/rpg_editor/play_started = 게임이 맵 {0}, 칸 ({1}, {2})에서 시작합니다
tools/rpg_editor/copy_none = 복사할 것이 없습니다. 먼저 배치를 선택하세요
tools/rpg_editor/copied = 배치 {0}개를 복사했습니다
tools/rpg_editor/paste_none = 클립보드가 비어 있습니다. 먼저 배치를 복사하세요 (Ctrl+C)
tools/rpg_editor/paste_refused = 붙여넣기 거부: 사본이 맵에 들어가지 않거나 맵이 다른 모드의 것입니다
tools/rpg_editor/pasted = 배치 {0}개를 붙여넣었습니다. Ctrl+Z로 되돌릴 수 있습니다
