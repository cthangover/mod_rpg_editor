tools/rpg_editor/tool_effects = 效果
tools/rpg_editor/tool_effects_tip = 在格子上绘制效果遮罩（右键擦除）
tools/rpg_editor/effect_profile_tip = 「效果」工具绘制的氛围配置
tools/rpg_editor/play = 从这里开始
tools/rpg_editor/play_tip = 从最后点击的格子开始在此地图上运行游戏（点击前从出生点开始）。未保存的修改会先保存
tools/rpg_editor/play_no_game = 游戏未运行：只能在 RPG 游戏中从编辑器开始游玩
tools/rpg_editor/play_not_loaded = 游戏还不认识这张地图
tools/rpg_editor/play_started = 游戏从地图 {0}、格子 ({1}, {2}) 开始
tools/rpg_editor/copy_none = 没有可复制的内容：请先选中摆放物
tools/rpg_editor/copied = 已复制摆放物：{0}
tools/rpg_editor/paste_none = 剪贴板为空：请先复制摆放物（Ctrl+C）
tools/rpg_editor/paste_refused = 粘贴被拒绝：副本放不进地图，或该地图属于其他模组
tools/rpg_editor/pasted = 已粘贴摆放物：{0}。Ctrl+Z 可撤销
