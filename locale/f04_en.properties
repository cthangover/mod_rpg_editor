tools/rpg_editor/geometry_toggle = Geometry and walk-around
tools/rpg_editor/geometry_toggle_tip = Show the selected footprint, picture bounds and depth points. The figure affects this preview only.
tools/rpg_editor/geometry_step = Step figure
tools/rpg_editor/geometry_step_tip = Move one cell along the ring. A blocked step stops the figure; it never skips across it.
tools/rpg_editor/geometry_play = Walk around
tools/rpg_editor/geometry_play_tip = Repeat the walk over adjacent passable cells. The 1.8-cell figure uses ordinary renderer depth sorting.
tools/rpg_editor/geometry_stop = Stop
tools/rpg_editor/geometry_reset = Restart
tools/rpg_editor/geometry_select = Select a visible placement. Geometry and the figure leave authoring data, undo history and gameplay unchanged.
tools/rpg_editor/geometry_summary = {0}: footprint {1}×{2}, walk bounds {3}×{4}; {5} points, {6} blocked.
tools/rpg_editor/geometry_closed = A complete loop is available.
tools/rpg_editor/geometry_incomplete = The loop is incomplete: movement stops before an obstacle.
tools/rpg_editor/geometry_legend = Orange: footprint; red cells: its mask; cyan: picture; gold: image anchor; magenta: depth point. Ring dots mark path cells; white marks the figure’s feet.
tools/rpg_editor/geometry_part = {0}: image anchor ({1:0.##}; {2:0.##}), depth point ({3:0.##}; {4:0.##}) — {5}.
tools/rpg_editor/geometry_behind = behind the figure
tools/rpg_editor/geometry_front = in front of the figure
tools/rpg_editor/geometry_by_position = by position
tools/rpg_editor/geometry_more_parts = Additional parts on the canvas: {0}.
tools/rpg_editor/geometry_large_mask = The large mask is shown as an outline.
