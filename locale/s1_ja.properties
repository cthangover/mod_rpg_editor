tools/rpg_editor/interact_now_shop = ショップ {0} を開きます。
tools/rpg_editor/interact_now_custom = カスタムの相互作用です。ファイルに書かれたとおりに残ります。種類を選ぶと置き換えられます。
tools/rpg_editor/interact_kind = 内容
tools/rpg_editor/interact_kind_tip = この配置からプレイヤーが得るもの
tools/rpg_editor/interact_kind_none = なし
tools/rpg_editor/interact_kind_item = アイテムを与える
