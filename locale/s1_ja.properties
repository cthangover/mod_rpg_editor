tools/rpg_editor/interact_kind_shop = ショップを開く
tools/rpg_editor/interact_kind_custom = カスタム（書かれたまま）
tools/rpg_editor/interact_trigger = タイミング
tools/rpg_editor/interact_trigger_tip = 使用時：オブジェクトに向いて決定キー（E または F）。踏んだとき：プレイヤーが踏んだとき。
tools/rpg_editor/interact_trigger_use = 使用時（E / F）
tools/rpg_editor/interact_trigger_step = 踏んだとき
tools/rpg_editor/interact_item = アイテム
tools/rpg_editor/interact_item_tip = プレイヤーが受け取るアイテム
tools/rpg_editor/interact_count = 個数
tools/rpg_editor/interact_map = マップ
tools/rpg_editor/interact_map_tip = プレイヤーが移動するマップ
tools/rpg_editor/interact_x = 目標 X
tools/rpg_editor/interact_y = 目標 Y
tools/rpg_editor/interact_dir = 向き
tools/rpg_editor/interact_dir_tip = 到着後にプレイヤーが向く方向
tools/rpg_editor/dir_down = 下
tools/rpg_editor/dir_left = 左
tools/rpg_editor/dir_right = 右
tools/rpg_editor/dir_up = 上
tools/rpg_editor/interact_pick = マップ上でマスを選ぶ
tools/rpg_editor/interact_pick_tip = プレイヤーが到着するマスをクリックします。別のマップの場合はまずそのマップが開きます。クリックした時点で移動先が書き込まれ、元のマップが再び開きます。
tools/rpg_editor/interact_scenario = ダイアログ
tools/rpg_editor/interact_scenario_tip = オブジェクトが開くダイアログ
tools/rpg_editor/interact_shop = ショップ
tools/rpg_editor/interact_shop_tip = オブジェクトが開くショップ
tools/rpg_editor/interact_none_chosen = （なし）
tools/rpg_editor/encounters_add_enemy = 敵のグループを追加...
tools/rpg_editor/encounters_enemy_tip = この敵だけのグループとして行を追加します。行を編集すると複数の敵を一つのグループにまとめられます。
tools/rpg_editor/pick_no_target = 先にテレポートのマップを選んでください
tools/rpg_editor/pick_same_map = このマップで到着するマスをクリックしてください。Esc で取り消し。
tools/rpg_editor/pick_save_first = 先にマップを保存してください。別のマップのマスを選ぶとそのマップが開き、未保存の変更が失われます
tools/rpg_editor/pick_on_map = マップ {0} で到着するマスをクリックしてください。Esc で取り消し。
tools/rpg_editor/pick_done = テレポートはマップ {0} のマス ({1}, {2}) へ移動します。Ctrl+S で保存してください。
tools/rpg_editor/pick_not_written = テレポートを書き込めませんでした。ログを確認してください
tools/rpg_editor/pick_cancelled = 選択を取り消しました
