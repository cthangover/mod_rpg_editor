tools/rpg_editor/interact_title = 相互作用
tools/rpg_editor/interact_hint = プレイヤーがこの配置を使う、または踏んだときに起きること。ここで選ぶと、この配置だけオブジェクト自身の相互作用を置き換えます。
tools/rpg_editor/interact_now_none = ここでは何も起きません。
tools/rpg_editor/interact_now_item = 与えるもの：{0}、個数：{1}。
tools/rpg_editor/interact_now_map = マップ {0} のマス ({1}, {2}) へ移動します。
