tools/rpg_editor/paint_rectangle = Прямоугольник
tools/rpg_editor/paint_modes_tip = Кисть следует за указателем. Заливка выбирает связную область одинаковых значений. Прямоугольник включает клетки обоих углов. Предпросмотр не меняет данные; отпускание создаёт один шаг отмены. Правая кнопка очищает поверхность/сегменты или открывает коллизию.
tools/rpg_editor/paint_rectangle_budget = Прямоугольник больше 16 384 клеток. Ничего не закрашено; выберите меньший прямоугольник.
