tools/rpg_editor/tab_character = 游戏角色
tools/rpg_editor/character_no_sheet = 该角色没有行走图（Charset），无法放到地图上。
tools/rpg_editor/character_chosen = 角色 {0} 的演员已就绪。点击地图即可放置。
tools/rpg_editor/character_chosen_joins = 角色 {0} 的演员已就绪。在地图上与其对话即可加入队伍。
tools/rpg_editor/preview_title = 状态预览
tools/rpg_editor/preview_hint = 下面的标记仅用于本次预览：不保存任何内容，游戏的标记也不会改变。显示的状态是在这些标记下生效的状态。
tools/rpg_editor/preview_state = 生效的状态：{0}
tools/rpg_editor/preview_base = 基础状态（没有状态生效）
tools/rpg_editor/preview_no_flags = 该对象的状态或交互中没有 self. 标记。
tools/rpg_editor/preview_no_object = 找不到该放置项的对象。
tools/rpg_editor/preview_reset = 清除预览标记
tools/rpg_editor/preview_reset_tip = 把该放置项的所有预览标记重置为 0。不会写入任何文件或游戏。
