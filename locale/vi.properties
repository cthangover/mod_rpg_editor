mod_rpg_editor_name = Trình sửa bản đồ RPG
mod_rpg_editor_desc = Sửa bản đồ RPG của engine rpg khi game đang chạy: bảng đối tượng theo hình dạng, bản đồ ở hai phép chiếu, vị trí đặt (của mod khác dưới dạng bản vá), va chạm, điểm xuất hiện, liên kết dịch chuyển và trận gặp. Lưu xong thế giới cập nhật ngay.
