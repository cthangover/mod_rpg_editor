tools/rpg_editor/tool_effects = Efectos
tools/rpg_editor/tool_effects_tip = Pintar una máscara de efecto sobre casillas (el botón derecho borra)
tools/rpg_editor/effect_profile_tip = El perfil de atmósfera que pinta la herramienta Efectos
tools/rpg_editor/play = Jugar desde aquí
tools/rpg_editor/play_tip = Iniciar el juego en este mapa desde la última casilla pulsada (antes de pulsar, desde el punto de aparición). Los cambios sin guardar se guardan primero
tools/rpg_editor/play_no_game = El juego no está en marcha: jugar desde el editor solo funciona en un juego RPG
tools/rpg_editor/play_not_loaded = El juego todavía no conoce este mapa
tools/rpg_editor/play_started = El juego empieza en el mapa {0}, casilla ({1}, {2})
tools/rpg_editor/copy_none = Nada que copiar: selecciona primero las colocaciones
tools/rpg_editor/copied = Colocaciones copiadas: {0}
tools/rpg_editor/paste_none = El portapapeles está vacío: copia primero las colocaciones (Ctrl+C)
tools/rpg_editor/paste_refused = Pegado rechazado: las copias no caben en el mapa o el mapa es de otro mod
tools/rpg_editor/pasted = Colocaciones pegadas: {0}. Ctrl+Z las quita
