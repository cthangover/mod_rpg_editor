tools/rpg_editor/interact_title = 互动
tools/rpg_editor/interact_hint = 玩家使用或踩上此摆放时发生的事。此处的选择只替换这一个摆放的对象自带互动。
tools/rpg_editor/interact_now_none = 这里不会发生任何事。
tools/rpg_editor/interact_now_item = 给予：{0}，数量：{1}。
tools/rpg_editor/interact_now_map = 通往地图 {0}，格子 ({1}, {2})。
tools/rpg_editor/interact_now_dialog = 打开对话 {0}。
tools/rpg_editor/interact_now_shop = 打开商店 {0}。
tools/rpg_editor/interact_now_custom = 自定义互动：保持文件中的写法不变。选择一种类型即可替换。
tools/rpg_editor/interact_kind = 作用
tools/rpg_editor/interact_kind_tip = 玩家从此摆放得到什么
tools/rpg_editor/interact_kind_none = 无
tools/rpg_editor/interact_kind_item = 给予物品
tools/rpg_editor/interact_kind_map = 前往另一格子或地图
tools/rpg_editor/interact_kind_dialog = 打开对话
tools/rpg_editor/interact_kind_shop = 打开商店
tools/rpg_editor/interact_kind_custom = 自定义（保持原样）
tools/rpg_editor/interact_trigger = 时机
tools/rpg_editor/interact_trigger_tip = 使用时：面向物体时按动作键（E 或 F）。踩上时：玩家踩到它的时候。
tools/rpg_editor/interact_trigger_use = 使用时（E / F）
tools/rpg_editor/interact_trigger_step = 踩上时
tools/rpg_editor/interact_item = 物品
tools/rpg_editor/interact_item_tip = 玩家获得的物品
tools/rpg_editor/interact_count = 数量
tools/rpg_editor/interact_map = 地图
tools/rpg_editor/interact_map_tip = 玩家前往的地图
tools/rpg_editor/interact_x = 目标 X
tools/rpg_editor/interact_y = 目标 Y
tools/rpg_editor/interact_dir = 朝向
tools/rpg_editor/interact_dir_tip = 到达后玩家面向的方向
tools/rpg_editor/dir_down = 下
tools/rpg_editor/dir_left = 左
tools/rpg_editor/dir_right = 右
tools/rpg_editor/dir_up = 上
tools/rpg_editor/interact_pick = 在地图上选择格子
tools/rpg_editor/interact_pick_tip = 点击玩家抵达的格子。若是其他地图，先打开该地图；点击时写入传送目标，然后重新打开你来的地图。
tools/rpg_editor/interact_scenario = 对话
tools/rpg_editor/interact_scenario_tip = 对象打开的对话
tools/rpg_editor/interact_shop = 商店
tools/rpg_editor/interact_shop_tip = 对象打开的商店
tools/rpg_editor/interact_none_chosen = （无）
tools/rpg_editor/encounters_add_enemy = 添加敌人组...
tools/rpg_editor/encounters_enemy_tip = 添加一行，该敌人单独成组。编辑该行可把敌人放进同一组。
tools/rpg_editor/pick_no_target = 请先选择传送的地图
tools/rpg_editor/pick_same_map = 点击本地图上的抵达格子。Esc 取消。
tools/rpg_editor/pick_save_first = 请先保存地图：在其他地图上选格子会打开该地图，未保存的更改会丢失
tools/rpg_editor/pick_on_map = 点击地图 {0} 上的抵达格子。Esc 取消。
tools/rpg_editor/pick_done = 传送现在通往地图 {0} 的格子 ({1}, {2})。按 Ctrl+S 保存。
tools/rpg_editor/pick_not_written = 传送未写入：请查看日志
tools/rpg_editor/pick_cancelled = 已取消选择
