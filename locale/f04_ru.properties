tools/rpg_editor/geometry_play_tip = Повторяемый обход по соседним проходимым клеткам. Фигура высотой 1,8 клетки проходит через обычную сортировку рендера.
tools/rpg_editor/geometry_stop = Остановить
tools/rpg_editor/geometry_reset = В начало
tools/rpg_editor/geometry_select = Выберите видимый объект. Геометрия и пробник не меняют данные, историю правок и игру.
