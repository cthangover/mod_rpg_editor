tools/rpg_editor/map_width=宽度（格）
tools/rpg_editor/map_height=高度（格）
tools/rpg_editor/map_resize=调整地图大小
tools/rpg_editor/map_resize_hint=新格子添加在右侧和下方，原有格子坐标保持不变。
tools/rpg_editor/map_grid=显示网格
tools/rpg_editor/map_resize_refused=无法调整大小：对象、事件或出生点将超出地图边界，或地图过大。
tools/rpg_editor/backdrop_title=背景图片
tools/rpg_editor/backdrop_none=当前投影没有独立的背景图片。
tools/rpg_editor/backdrop_picture=图片
tools/rpg_editor/backdrop_x=图片 X（像素）
tools/rpg_editor/backdrop_y=图片 Y（像素）
tools/rpg_editor/backdrop_apply=应用位置
tools/rpg_editor/backdrop_hint=每步为缩放前的一个地图像素。仅移动图片；网格、事件和角色保持原位。
