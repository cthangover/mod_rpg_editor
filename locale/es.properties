mod_rpg_editor_name = Editor de mapas RPG
mod_rpg_editor_desc = Edita los mapas RPG del motor rpg mientras el juego corre: paleta por forma, el mapa en ambas proyecciones, colocaciones (las de otros mods como parches), colisiones, punto de aparición, enlaces de teletransporte y encuentros. Guardar actualiza el mundo al instante.
