tools/rpg_editor/tool_effects = エフェクト
tools/rpg_editor/tool_effects_tip = セルの上にエフェクトのマスクを塗る（右ボタンで消去）
tools/rpg_editor/effect_profile_tip = エフェクトツールが塗る雰囲気プロファイル
tools/rpg_editor/play = ここから遊ぶ
tools/rpg_editor/play_tip = 最後にクリックしたセルからこのマップでゲームを始めます（クリック前は出現地点）。未保存の変更は先に保存されます
tools/rpg_editor/play_no_game = ゲームが動いていません。エディタから遊べるのは RPG ゲームの中だけです
tools/rpg_editor/play_not_loaded = ゲームはまだこのマップを知りません
tools/rpg_editor/play_started = ゲームはマップ {0}、セル ({1}, {2}) で始まります
tools/rpg_editor/copy_none = コピーするものがありません。先に配置を選択してください
tools/rpg_editor/copied = 配置を {0} 個コピーしました
tools/rpg_editor/paste_none = クリップボードが空です。先に配置をコピーしてください（Ctrl+C）
tools/rpg_editor/paste_refused = 貼り付けを拒否しました：コピーがマップに収まらないか、マップが別のモッドのものです
tools/rpg_editor/pasted = 配置を {0} 個貼り付けました。Ctrl+Z で取り消せます
