tools/rpg_editor/tab_character = 캐릭터
tools/rpg_editor/character_no_sheet = 이 캐릭터는 걷기 스프라이트(Charset)가 없어 맵에 배치할 수 없습니다.
tools/rpg_editor/character_chosen = 액터 {0} 준비됨. 맵을 클릭해 배치하세요.
tools/rpg_editor/character_chosen_joins = 액터 {0} 준비됨. 맵에서 말을 걸면 일행에 합류합니다.
tools/rpg_editor/preview_title = 상태 미리보기
tools/rpg_editor/preview_hint = 아래 플래그는 이 미리보기만을 위한 것입니다. 아무것도 저장되지 않으며 게임의 플래그도 바뀌지 않습니다. 표시되는 상태는 이 값들에 적용되는 상태입니다.
tools/rpg_editor/preview_state = 적용되는 상태: {0}
tools/rpg_editor/preview_base = 기본 상태(적용되는 상태 없음)
tools/rpg_editor/preview_no_flags = 이 오브젝트의 상태나 상호작용에 self. 플래그가 없습니다.
tools/rpg_editor/preview_no_object = 이 배치의 오브젝트를 찾을 수 없습니다.
tools/rpg_editor/preview_reset = 미리보기 플래그 지우기
tools/rpg_editor/preview_reset_tip = 이 배치의 미리보기 플래그를 모두 0으로 되돌립니다. 파일이나 게임에는 아무것도 쓰지 않습니다.
