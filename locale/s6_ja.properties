tools/rpg_editor/tab_character = キャラクター
tools/rpg_editor/character_no_sheet = このキャラクターには歩行スプライト(Charset)がないため、マップに置けません。
tools/rpg_editor/character_chosen = アクター {0} の準備ができました。マップをクリックして置いてください。
tools/rpg_editor/character_chosen_joins = アクター {0} の準備ができました。マップ上で話しかけると仲間に加わります。
tools/rpg_editor/preview_title = 状態のプレビュー
tools/rpg_editor/preview_hint = 下のフラグはこのプレビューのためだけのものです。何も保存されず、ゲームのフラグも変わりません。表示される状態は、これらのフラグで適用されるものです。
tools/rpg_editor/preview_state = 適用される状態: {0}
tools/rpg_editor/preview_base = 基本状態(適用される状態はありません)
tools/rpg_editor/preview_no_flags = このオブジェクトの状態や相互作用に self. フラグはありません。
tools/rpg_editor/preview_no_object = この配置のオブジェクトが見つかりません。
tools/rpg_editor/preview_reset = プレビューのフラグをクリア
tools/rpg_editor/preview_reset_tip = この配置のプレビューフラグをすべて 0 に戻します。ファイルにもゲームにも何も書き込まれません。
