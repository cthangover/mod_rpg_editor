tools/rpg_editor/rules_toggle = Правила клетки
tools/rpg_editor/rules_tip = Последняя клетка под указателем: переопределения коллизии, маски и итоговые строки/штрихи. Только чтение.
tools/rpg_editor/rules_check = Проверить
tools/rpg_editor/rules_check_tip = Проверяет доступность от старта, взаимодействия, прибытия и постоянные шаги маршрутов в текущем предпросмотре. Не запускает игру и не запрещает сохранение.
tools/rpg_editor/rules_cell = Клетка ({0}; {1}): {2}.
tools/rpg_editor/rules_walkable = проходима
tools/rpg_editor/rules_blocked = непроходима
tools/rpg_editor/rules_reason_outside = За границей карты: проход закрыт.
tools/rpg_editor/rules_reason_block = Явный # важнее всех масок.
tools/rpg_editor/rules_reason_open = Явный o важнее масок: объекты и рельеф намеренно не блокируют эту клетку.
tools/rpg_editor/rules_reason_placement = Маска объекта или события закрывает проход.
tools/rpg_editor/rules_reason_structure = Итоговая структура закрывает проход.
tools/rpg_editor/rules_reason_ground = Итоговая поверхность закрывает проход.
tools/rpg_editor/rules_reason_free = Ни одно блокирующее правило не сработало.
tools/rpg_editor/rules_source = Итоговая карта: {0}/{1}.
tools/rpg_editor/rules_patch = Местные изменения принадлежат {0}; история вышестоящих патчей здесь недоступна.
tools/rpg_editor/rules_masks = Маски объектов и событий: {0}
tools/rpg_editor/rules_path = Кратчайший путь от старта по соседним клеткам: {0} шагов.
tools/rpg_editor/rules_no_path = Подтверждённого пути от старта нет: преграда, недостижимость или незавершённая проверка.
tools/rpg_editor/rules_summary = Доступно клеток: {0}. Замечаний: {1}.
tools/rpg_editor/rules_snapshot = Предупреждения для текущего предпросмотра. Условия, движущаяся толпа и взаимодействия не исполняются. Наведите указатель на клетку для длины пути.
tools/rpg_editor/rules_issue = {0}: {1}, клетка ({2}; {3}).
tools/rpg_editor/rules_issue_budget = Проверка не завершена: превышен бюджет клеток или нет карты
tools/rpg_editor/rules_issue_spawn = Старт за границей карты или непроходим
tools/rpg_editor/rules_issue_event = Нет доступного входа или стороны для взаимодействия
tools/rpg_editor/rules_issue_target = Карта прибытия недоступна для проверки
tools/rpg_editor/rules_issue_arrival = Клетка прибытия за границей или непроходима в предпросмотре цели
tools/rpg_editor/rules_issue_route = Постоянный маршрут упирается маской в преграду или границу
tools/rpg_editor/rules_issue_route_dynamic = Маршрут зависит от игры или случайности; проверен только предшествующий постоянный участок
