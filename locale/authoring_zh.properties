tools/rpg_editor/event_source = 来源：{0}/{1}
tools/rpg_editor/edit_event_source = 编辑源文件
tools/rpg_editor/editing_event_source = 正在编辑事件：{0}/{1}
tools/rpg_editor/base_state = 基础状态（例如未打开的木桶）
tools/rpg_editor/section_pages = 附加状态
tools/rpg_editor/pages_hint = 基础命令提供首次打开的奖励。在这里设置打开后的外观和重复交互。最后一个满足条件的状态生效；空条件表示始终。
tools/rpg_editor/page_add = + 状态
tools/rpg_editor/page_remove = 删除状态
tools/rpg_editor/page_title = 状态 {0}
tools/rpg_editor/page_condition = 条件
tools/rpg_editor/page_sprite = 图像
tools/rpg_editor/page_commands = 此状态的命令
tools/rpg_editor/page_always = 始终
